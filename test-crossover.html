<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste Crossover - Scooby Plus</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #1a1a1a;
            color: white;
        }
        .player-container {
            width: 100%;
            height: 500px;
            background-color: #000;
            margin: 20px 0;
        }
        .player-container iframe {
            width: 100%;
            height: 100%;
        }
        .test-buttons {
            margin: 20px 0;
        }
        .test-buttons button {
            margin: 10px;
            padding: 10px 20px;
            background-color: #ff9800;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .test-buttons button:hover {
            background-color: #e68900;
        }
    </style>
</head>
<body>
    <h1>Teste de Crossovers - Google Drive vs Dailymotion</h1>
    
    <div class="test-buttons">
        <button onclick="testGoogleDrive()">Testar Google Drive (Bravo Dooby-Doo!)</button>
        <button onclick="testGoogleDrive2()">Testar Google Drive (A Prisão do Salsicha)</button>
        <button onclick="testDailymotion()">Testar Dailymotion (Casos Estranhos do Batman)</button>
    </div>
    
    <div class="player-container" id="player-container">
        <p style="padding: 20px; text-align: center;">Clique em um dos botões acima para testar</p>
    </div>
    
    <script>
        function renderPlayer(videoUrl, title) {
            const container = document.getElementById('player-container');
            let iframeHtml = '';
            
            console.log('Testing URL:', videoUrl);
            
            // Detecta se é Google Drive ou Dailymotion
            if (videoUrl.includes('drive.google.com')) {
                // Extrai o ID do Google Drive e converte para embed
                const fileIdMatch = videoUrl.match(/\/d\/([a-zA-Z0-9-_]+)/);
                if (fileIdMatch) {
                    const fileId = fileIdMatch[1];
                    const embedUrl = `https://drive.google.com/file/d/${fileId}/preview`;
                    iframeHtml = `
                        <iframe 
                            frameborder="0" 
                            width="100%" 
                            height="100%" 
                            src="${embedUrl}"
                            allowfullscreen="true"
                            webkitallowfullscreen="true"
                            mozallowfullscreen="true"
                            allow="autoplay; fullscreen; picture-in-picture">
                        </iframe>
                        <p style="padding: 10px; background: #333; margin: 0;">
                            <strong>Google Drive:</strong> ${title}<br>
                            <strong>Embed URL:</strong> ${embedUrl}
                        </p>
                    `;
                } else {
                    iframeHtml = `<p style="color:red;padding:20px;">Erro: Link do Google Drive inválido.</p>`;
                }
            } else {
                // Assume que é Dailymotion (ID direto)
                const embedUrl = `https://www.dailymotion.com/embed/video/${videoUrl}?autoplay=1&info=0&logo=0&ui-highlight=%23ff9800&mute=0&ui-components=controls&quality=1080&fullscreen=1`;
                iframeHtml = `
                    <iframe 
                        frameborder="0" 
                        width="100%" 
                        height="100%" 
                        src="${embedUrl}"
                        allowfullscreen="true"
                        webkitallowfullscreen="true"
                        mozallowfullscreen="true"
                        allow="autoplay; fullscreen; picture-in-picture; web-share; accelerometer; gyroscope">
                    </iframe>
                    <p style="padding: 10px; background: #333; margin: 0;">
                        <strong>Dailymotion:</strong> ${title}<br>
                        <strong>Video ID:</strong> ${videoUrl}
                    </p>
                `;
            }
            
            container.innerHTML = iframeHtml;
        }
        
        function testGoogleDrive() {
            const url = "https://drive.google.com/file/d/1W7__vN0jdT3fmCggADQPXrh9e6EhYDyX/view?usp=drive_link";
            renderPlayer(url, "Bravo Dooby-Doo! (Johnny Bravo 1997)");
        }
        
        function testGoogleDrive2() {
            const url = "https://drive.google.com/file/d/1MiXxpptBMo0E9iGxUgOdZY2RdH9totoB/view?usp=drive_link";
            renderPlayer(url, "A Prisão do Salsicha (Harvey, o Advogado 2000)");
        }
        
        function testDailymotion() {
            const url = "k6zsIkBXVEITjUD74i2";
            renderPlayer(url, "Casos Estranhos do Batman (Batman: Os Bravos e Destemidos 2011)");
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Teste Final</title>
    <script>
        function testPlayer() {
            const videoUrl = "gdrive:1W7__vN0jdT3fmCggADQPXrh9e6EhYDyX";
            const seriesId = "cross001";
            
            console.log('Testing with:', videoUrl, seriesId);
            
            if ((seriesId === 'cross001' || seriesId === 'cross002') || videoUrl.startsWith('gdrive:')) {
                console.log('Google Drive detected!');
                const fileId = videoUrl.replace('gdrive:', '');
                const embedUrl = `https://drive.google.com/file/d/${fileId}/preview`;
                
                document.getElementById('result').innerHTML = `
                    <p>✅ Google Drive detectado!</p>
                    <p>File ID: ${fileId}</p>
                    <p>Embed URL: ${embedUrl}</p>
                    <iframe src="${embedUrl}" width="100%" height="400" frameborder="0"></iframe>
                `;
            } else {
                document.getElementById('result').innerHTML = '❌ Não detectou Google Drive';
            }
        }
    </script>
</head>
<body>
    <h1>Teste Final de Detecção</h1>
    <button onclick="testPlayer()">Testar</button>
    <div id="result"></div>
</body>
</html>

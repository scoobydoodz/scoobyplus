<!DOCTYPE html>
<html>
<head>
    <title>Teste Detecção</title>
    <script src="data/scooby_doo_data.js"></script>
</head>
<body>
    <h1>Teste de Detecção de URL</h1>
    <div id="result"></div>
    
    <script>
        function detectUrlType(url) {
            if (!url || typeof url !== 'string') {
                return 'unknown';
            }
            if (url.startsWith('gdrive:')) {
                return 'googledrive';
            }
            if (url.indexOf('drive.google.com') !== -1) {
                return 'googledrive';
            }
            if (url.indexOf('http') === 0) {
                return 'external';
            }
            return 'dailymotion';
        }
        
        const cross001 = CONTENT_CATEGORIES.crossovers.items.cross001.dailymotion_videos['1_1'];
        const cross002 = CONTENT_CATEGORIES.crossovers.items.cross002.dailymotion_videos['1_1'];
        
        document.getElementById('result').innerHTML = `
            <p>Cross001 URL: ${cross001}</p>
            <p>Cross001 Type: ${detectUrlType(cross001)}</p>
            <p>Cross002 URL: ${cross002}</p>
            <p>Cross002 Type: ${detectUrlType(cross002)}</p>
        `;
    </script>
</body>
</html>

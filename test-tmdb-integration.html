<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste TMDB + Dados Locais</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #1a1a1a; color: white; }
        .test-result { margin: 10px 0; padding: 10px; border-radius: 5px; }
        .success { background: #2d5a2d; }
        .error { background: #5a2d2d; }
        .info { background: #2d4a5a; }
    </style>
</head>
<body>
    <h1>Teste de Integração TMDB + Dados Locais</h1>
    <div id="results"></div>

    <script src="data/scooby_doo_data.js"></script>
    <script>
        async function testIntegration() {
            const results = document.getElementById('results');
            
            // Teste 1: Verificar se as variáveis TMDB estão definidas
            if (typeof TMDB_API_KEY !== 'undefined' && TMDB_API_KEY) {
                results.innerHTML += '<div class="test-result success">✅ Configurações TMDB carregadas</div>';
            } else {
                results.innerHTML += '<div class="test-result error">❌ Configurações TMDB não encontradas</div>';
                return;
            }
            
            // Teste 2: Verificar se os dados locais estão carregados
            if (typeof CONTENT_CATEGORIES !== 'undefined' && CONTENT_CATEGORIES.series) {
                results.innerHTML += '<div class="test-result success">✅ Dados locais carregados</div>';
            } else {
                results.innerHTML += '<div class="test-result error">❌ Dados locais não encontrados</div>';
                return;
            }
            
            // Teste 3: Testar chamada à API do TMDB
            try {
                const response = await fetch(`${TMDB_BASE_URL}/tv/1398?api_key=${TMDB_API_KEY}&language=pt-BR`);
                if (response.ok) {
                    const data = await response.json();
                    results.innerHTML += `<div class="test-result success">✅ API TMDB funcionando - Série: ${data.name}</div>`;
                } else {
                    results.innerHTML += '<div class="test-result error">❌ Erro na API TMDB: ' + response.status + '</div>';
                }
            } catch (error) {
                results.innerHTML += '<div class="test-result error">❌ Erro ao conectar com TMDB: ' + error.message + '</div>';
            }
            
            // Teste 4: Verificar dados locais específicos
            const scoobyOriginal = CONTENT_CATEGORIES.series.items['1398'];
            if (scoobyOriginal && scoobyOriginal.episodes) {
                results.innerHTML += '<div class="test-result success">✅ Dados locais específicos encontrados (episódios)</div>';
            } else {
                results.innerHTML += '<div class="test-result info">ℹ️ Dados locais básicos (sem episódios detalhados)</div>';
            }
            
            // Teste 5: Verificar crossovers
            const crossovers = CONTENT_CATEGORIES.crossovers;
            if (crossovers && Object.keys(crossovers.items).length > 0) {
                results.innerHTML += '<div class="test-result success">✅ Crossovers carregados</div>';
            } else {
                results.innerHTML += '<div class="test-result error">❌ Crossovers não encontrados</div>';
            }
            
            results.innerHTML += '<div class="test-result info">🎉 Teste concluído! A aplicação deve estar funcionando com TMDB + dados locais.</div>';
        }
        
        // Aguarda o carregamento e executa o teste
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(testIntegration, 500);
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Debug Test</title>
    <script src="data/scooby_doo_data.js"></script>
</head>
<body>
    <h1>Debug Test</h1>
    <div id="output"></div>
    
    <script>
        const output = document.getElementById('output');
        const seriesData = CONTENT_CATEGORIES.series.items["926"];
        
        output.innerHTML = `
            <h2>Dados da Série 926:</h2>
            <p><strong>Título:</strong> ${seriesData.title}</p>
            <p><strong>Overview:</strong> ${seriesData.overview}</p>
            <p><strong>Poster:</strong> ${seriesData.poster_path}</p>
            <p><strong>Backdrop:</strong> ${seriesData.backdrop_path}</p>
            <h3>Episódios:</h3>
            <ul>
                ${Object.keys(seriesData.dailymotion_videos).slice(0, 5).map(key => 
                    `<li>${key}: ${seriesData.dailymotion_videos[key]}</li>`
                ).join('')}
            </ul>
        `;
    </script>
</body>
</html>
